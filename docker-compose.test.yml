services:
  testdb:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shafsky
      POSTGRES_PASSWORD: shafsky
      POSTGRES_DB: shafsky_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shafsky -d shafsky_test"]
      interval: 3s
      timeout: 5s
      retries: 10
