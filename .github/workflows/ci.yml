name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shafsky
          POSTGRES_PASSWORD: shafsky
          POSTGRES_DB: shafsky_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shafsky -d shafsky_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql://shafsky:shafsky@localhost:5432/shafsky_test
      TEST_DATABASE_URL: postgresql://shafsky:shafsky@localhost:5432/shafsky_test
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      REQUIRE_REDIS: "false"
      TRUST_PROXY: "false"
      ALLOW_HS256_LEGACY_FALLBACK: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ensure airports.csv
        run: |
          if [ ! -f data/airports.csv ]; then
            python tools/download_airports_csv.py
          fi
          test -s data/airports.csv

      - name: Alembic upgrade
        run: alembic upgrade head

      - name: Pytest
        run: pytest -q --tb=short

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Ensure airports.csv for image build
        run: |
          if [ ! -f data/airports.csv ]; then
            python tools/download_airports_csv.py
          fi

      - name: Build production image
        run: docker build -t shafsky-backend:ci .
